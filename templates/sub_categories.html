{% for category in categories %}
<div class="nav-item ">
    <a class="nav-link d-flex justify-content-between align-items-center" data-toggle="collapse"
       href="{% url 'product:product_list' %}?category={{ category.slug }}" role="button"
       aria-expanded="false">
        <span>{{ category.title }}</span>
        {% if category.subs.all %}
          <i class="fa fa-angle-down mt-1"></i>
        {% endif %}
    </a>
    <div class="collapse" id="menu-{{ category.id }}">
        <div class="nav flex-column mr-3 border-right">
            {% include 'sub_categories.html' with categories=category.subs.all %}
        </div>
    </div>
</div>
{% endfor %}
